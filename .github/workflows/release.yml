name: Release

# Push a tag like v2.0.0 (matching "version-name" in metadata.json) to
# build the extension zip and the Windows app, and publish them as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Notchex.exe
        shell: bash
        run: |
          dotnet publish windows/Notchex/Notchex.csproj -c Release -r ${{ matrix.rid }} \
            --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true -p:Version="${GITHUB_REF_NAME#v}" -o out
          mv out/Notchex.exe "Notchex-${GITHUB_REF_NAME#v}-${{ matrix.rid }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.rid }}
          path: Notchex-*.exe

  release:
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches metadata.json
        run: |
          meta="v$(jq -r '."version-name"' metadata.json)"
          if [ "$meta" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match metadata.json version-name ($meta)"
            exit 1
          fi

      - name: Check JavaScript syntax
        run: |
          for f in extension.js notch.js prefs.js modules/*.js; do
            node --check --input-type=module < "$f" || { echo "::error file=$f::Syntax error"; exit 1; }
          done

      - name: Build zip
        run: |
          sudo apt-get install -y --no-install-recommends libglib2.0-bin
          make dist

      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          merge-multiple: true

      - name: Checksums
        run: sha256sum notchex@adityatakuli.shell-extension.zip install.sh Notchex-*.exe > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            notchex@adityatakuli.shell-extension.zip install.sh Notchex-*.exe SHA256SUMS \
            --title "Notchex $GITHUB_REF_NAME" \
            --generate-notes
